AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics - Week 5 Lab 1: the delivery photo application on ECS Fargate in eu-west-1.
  Containers in the private subnets of two Availability Zones, behind an internet-facing
  Application Load Balancer that accepts traffic only from CloudFront. Includes the task roles,
  logs, scaling and the monthly budget alert.
  Deployed by CloudFormation Git sync from infrastructure/deployments/dev/6-service.yaml.

# Reading order: Parameters -> 1 Logs and cluster -> 2 Roles -> 3 Task definition
#                -> 4 Load balancer -> 5 Service -> 6 Scaling -> 7 Budget -> Outputs
#
# Releasing a new version: the app repository pushes image sha-<commit> to ECR; change ImageTag
# in infrastructure/deployments/dev/6-service.yaml and merge. Git sync updates the task
# definition and ECS replaces the containers one by one (rolling update, automatic rollback).

Parameters:
  Project:
    Type: String
    Default: onward
  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
  Purpose:
    Type: String
    Default: photos

  ImageTag:
    Type: String
    Default: latest
    Description: Image tag to run, normally sha-<commit> pushed by the app repository's CD workflow.
  ApplicationPort:
    Type: Number
    Default: 8080
  TaskCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024']
  TaskMemory:
    Type: String
    Default: '1024'
    AllowedValues: ['512', '1024', '2048']
  MinTasks:
    Type: Number
    Default: 2
    MinValue: 2
    Description: At least 2, one per Availability Zone, so losing a task or a zone keeps the app up.
  MaxTasks:
    Type: Number
    Default: 4
  CpuTargetPercent:
    Type: Number
    Default: 50
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
  MaxUploadMb:
    Type: Number
    Default: 10

  MonthlyBudgetUsd:
    Type: Number
    Default: 100
  BudgetAlertEmail:
    Type: String
    Description: Receives the budget alerts.

Resources:
  # ============================================================ 1. Logs and cluster
  # Where every container writes its logs. Kept for LogRetentionDays, then deleted to control cost.
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${Project}/${Environment}/${Purpose}'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # The ECS cluster: a named group for the photo service. Fargate supplies the servers.
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${Project}-${Environment}-${Purpose}'
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # ============================================================ 2. Roles
  # Used by ECS itself (not the app) to pull the image from ECR and send logs to CloudWatch.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-${Purpose}-task-execution-role'
      Description: Lets ECS pull the photo image and write its logs.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # What the running application may do, and nothing more:
  #   - read and write photos under photos/ in the photo bucket (no listing, no permanent delete)
  #   - read the database secret that RDS manages
  PhotoAppPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-${Purpose}-app-policy'
      Description: The photo application's access to its bucket and its database secret.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadWritePhotos
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:DeleteObject
            Resource: !Sub
              - '${BucketArn}/photos/*'
              - BucketArn:
                  Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-bucket-arn'
          - Sid: ReadDatabaseSecret
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-db-secret-arn'

  # The identity the application code runs as. Its credentials come from ECS, never from code.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-${Purpose}-task-role'
      Description: Identity of the running photo application.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref PhotoAppPolicy
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # ============================================================ 3. Task definition
  # The recipe for one container: which image, how much CPU and memory, which roles, and the
  # settings it receives. Only names and addresses are passed; the password is read at runtime
  # from Secrets Manager by the app, using the task role.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Project}-${Environment}-${Purpose}'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: photos
          Image: !Sub
            - '${RepositoryUri}:${ImageTag}'
            - RepositoryUri:
                Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-repository-uri'
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ApplicationPort
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: !Ref ApplicationPort
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: JAVA_TOOL_OPTIONS
              Value: -XX:MaxRAMPercentage=75
            - Name: STORAGE_MODE
              Value: s3
            - Name: PHOTOS_BUCKET
              Value:
                Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-bucket-name'
            - Name: MAX_UPLOAD_MB
              Value: !Ref MaxUploadMb
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-db-endpoint'
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-db-port'
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-db-name'
            - Name: DB_SECRET_ARN
              Value:
                Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-db-secret-arn'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: photos
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # ============================================================ 4. Load balancer
  # Internet-facing, in both public subnets. Its security group accepts only CloudFront.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${Project}-${Environment}-${Purpose}-alb'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Split
        - ','
        - Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-public-subnet-ids'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-alb-sg-id'
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: idle_timeout.timeout_seconds
          Value: '60'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # The containers the load balancer sends traffic to. It checks GET /health on each one and
  # stops sending traffic to a container that fails, until ECS replaces it.
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${Project}-${Environment}-${Purpose}-tg'
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ApplicationPort
      VpcId:
        Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-vpc-id'
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Listens on port 80 (CloudFront -> ALB inside AWS) and forwards every request to the containers.
  # Viewers always use HTTPS to CloudFront.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ============================================================ 5. Service
  # Keeps MinTasks containers running across both private subnets (zones). If a container or a
  # zone fails, ECS starts replacements in a healthy zone. Releases are rolling: new containers
  # must pass the health check before old ones stop; a failing release rolls back by itself.
  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub '${Project}-${Environment}-${Purpose}'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref MinTasks
      HealthCheckGracePeriodSeconds: 90
      AvailabilityZoneRebalancing: ENABLED
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split
            - ','
            - Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-app-subnet-ids'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${Project}-${Environment}-${Purpose}-task-sg-id'
      LoadBalancers:
        - ContainerName: photos
          ContainerPort: !Ref ApplicationPort
          TargetGroupArn: !Ref TargetGroup
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # ============================================================ 6. Scaling
  # Between MinTasks and MaxTasks containers.
  ServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${Service.Name}'
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks

  # Adds containers when average CPU goes above the target, removes them when it falls.
  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${Project}-${Environment}-${Purpose}-cpu-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref CpuTargetPercent
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: 60
        ScaleInCooldown: 300

  # ============================================================ 7. Budget
  # Emails the owner at 80% of the monthly budget (actual) and 100% (forecast).
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${Project}-${Environment}-${Purpose}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

Outputs:
  LoadBalancerDnsName:
    Description: CloudFront's origin. Requests from anywhere else are refused by the security group.
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub '${Project}-${Environment}-${Purpose}-alb-dns'
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
