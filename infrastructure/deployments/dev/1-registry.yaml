# CloudFormation Git sync deployment file for stack "onward-dev-photos-registry" (eu-west-1).
# Stack order: registry -> network -> replica-storage (eu-west-2) -> storage -> database -> service -> cdn.
# Create it first: the service imports the repository, and ECS needs an image in it to start.
template-file-path: infrastructure/templates/1-registry.yaml

parameters:
  Project: onward
  Owner: Jado Fils SEZIKEYE
  Environment: dev
  Purpose: photos

  # Only the main branch of this repository may push images (GitHub OIDC, no access keys).
  GitHubOwner: jadofils
  GitHubOwnerId: '114186160'
  AppRepository: week-5-lab-1-photos-app
  # Replace with: gh api repos/jadofils/week-5-lab-1-photos-app --jq .id
  # '0' matches no repository, so nothing can push until the real ID is set.
  AppRepositoryId: '0'
  # This account already has the token.actions.githubusercontent.com provider.
  CreateGitHubOidcProvider: 'false'

  ImagesToKeep: '15'

tags:
  Project: onward
  Owner: Jado Fils SEZIKEYE
  Environment: dev
