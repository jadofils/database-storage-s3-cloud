AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics - Week 5 Lab 1 (delivery photos) one-time Git sync bootstrap. Creates the
  GitHub connection and the role CloudFormation Git sync uses to deploy every other stack.
  Deployed by hand twice: in eu-west-1 (CreateGitSyncRole 'true') and in eu-west-2 for the
  replica bucket (CreateGitSyncRole 'false', the role is global and already exists).

# Why this file is in infrastructure/bootstrap/ and not in infrastructure/templates/:
# it sets up the deployment tool, not the photo service. Git sync cannot deploy it, because it
# creates the GitHub connection and the role that Git sync itself needs. Everything in
# templates/ is deployed by Git sync.
#
# Names use "<project>-<env>-photos-*" so this lab never collides with other labs in the
# same account (Week 3 already owns onward-dev-github and onward-dev-gitsync-role).

Parameters:
  Project:
    Type: String
    Default: onward
  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
  Purpose:
    Type: String
    Default: photos
  CreateGitSyncRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: IAM roles are global. 'true' in the first Region, 'false' in the second.

Conditions:
  CreateRole: !Equals
    - !Ref CreateGitSyncRole
    - 'true'

Resources:
  # A connection belongs to one Region, so each Region gets its own.
  # It is created as PENDING; a person approves it once in the GitHub handshake (AWS requires this).
  GitHubConnection:
    Type: AWS::CodeConnections::Connection
    Properties:
      ConnectionName: !Sub '${Project}-${Environment}-${Purpose}-github'
      ProviderType: GitHub
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # The role Git sync assumes to create and update the stacks, in both Regions.
  GitSyncRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      RoleName: !Sub '${Project}-${Environment}-${Purpose}-gitsync-role'
      Description: Used by CloudFormation Git sync to deploy the delivery photo stacks.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.sync.codeconnections.amazonaws.com
            Action: sts:AssumeRole
      # PowerUserAccess covers VPC, ECS, ECR, load balancing, Auto Scaling, CloudWatch, S3, RDS,
      # Secrets Manager, CloudFront and Budgets. IAM is granted separately, limited to this lab's names.
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess'
        - !Ref GitSyncOperationsPolicy
        - !Ref GitSyncIamPolicy
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # The CloudFormation change-set calls Git sync makes for every commit.
  GitSyncOperationsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateRole
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-${Purpose}-gitsync-operations'
      Description: CloudFormation change-set permissions that Git sync needs.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SyncToCloudFormation
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStacks
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:ListChangeSets
              - cloudformation:ListStacks
              - cloudformation:ValidateTemplate
              - cloudformation:ListExports
              - cloudformation:ListImports
            Resource: '*'
          - Sid: ManagedRules
            Effect: Allow
            Action:
              - events:PutRule
              - events:PutTargets
            Resource: '*'
            Condition:
              StringEquals:
                events:ManagedBy: cloudformation.sync.codeconnections.amazonaws.com
          - Sid: DescribeRule
            Effect: Allow
            Action: events:DescribeRule
            Resource: '*'

  # IAM limited to this lab's roles and policies (onward-dev-photos-*), the GitHub OIDC provider
  # and the service-linked roles the services create on first use.
  GitSyncIamPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateRole
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-${Purpose}-gitsync-iam'
      Description: Manage only this lab's roles, customer managed policies and the GitHub OIDC provider.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LabRoles
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:UpdateRoleDescription
              - iam:UpdateAssumeRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:ListRoleTags
              - iam:PassRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-${Environment}-${Purpose}-*'
          - Sid: LabManagedPolicies
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:ListPolicyVersions
              - iam:ListEntitiesForPolicy
              - iam:TagPolicy
              - iam:UntagPolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${Project}-${Environment}-${Purpose}-*'
          - Sid: GitHubOidcProvider
            Effect: Allow
            Action:
              - iam:CreateOpenIDConnectProvider
              - iam:DeleteOpenIDConnectProvider
              - iam:GetOpenIDConnectProvider
              - iam:TagOpenIDConnectProvider
              - iam:UntagOpenIDConnectProvider
              - iam:AddClientIDToOpenIDConnectProvider
              - iam:RemoveClientIDFromOpenIDConnectProvider
              - iam:UpdateOpenIDConnectProviderThumbprint
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
          - Sid: ServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: '*'
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - ecs.amazonaws.com
                  - ecs.application-autoscaling.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
                  - rds.amazonaws.com

Outputs:
  ConnectionArn:
    Description: Approve this connection in the console (Developer Tools > Connections), then use it for Git sync.
    Value: !Ref GitHubConnection
  GitSyncRoleArn:
    Condition: CreateRole
    Value: !GetAtt GitSyncRole.Arn
